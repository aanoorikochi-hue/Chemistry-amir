<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمایشگاه شیمی حرفه‌ای</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #00d9ff;
    --primary-dark: #0099cc;
    --bg-dark: #0a0e27;
    --bg-card: #151a35;
    --bg-card-2: #1a2040;
    --text: #e8eef7;
    --text-dim: #8892b0;
    --success: #00ff88;
    --danger: #ff4757;
    --warning: #ffa502;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--bg-dark);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,217,255,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(157,78,221,0.08) 0%, transparent 50%);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    direction: rtl;
  }

  /* ====== هدر ====== */
  .header {
    text-align: center;
    margin-bottom: 30px;
    padding: 20px;
  }

  .header h1 {
    font-size: 2.5em;
    background: linear-gradient(135deg, var(--primary), #9d4edd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    font-weight: 800;
  }

  .header p {
    color: var(--text-dim);
    font-size: 1em;
  }

  /* ====== تب‌ها ====== */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    background: var(--bg-card);
    padding: 8px;
    border-radius: 50px;
    max-width: fit-content;
    margin-left: auto;
    margin-right: auto;
    border: 1px solid rgba(0,217,255,0.15);
  }

  .tab-btn {
    padding: 12px 24px;
    background: transparent;
    color: var(--text-dim);
    border: none;
    border-radius: 40px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s;
    font-family: inherit;
    white-space: nowrap;
  }

  .tab-btn:hover {
    color: var(--text);
    background: rgba(0,217,255,0.08);
  }

  .tab-btn.active {
    background: linear-gradient(135deg, var(--primary), #9d4edd);
    color: white;
    box-shadow: 0 4px 20px rgba(0,217,255,0.4);
  }

  .section { display: none; }
  .section.active {
    display: block;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ====== جدول تناوبی ====== */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .search-box {
    padding: 12px 20px;
    background: var(--bg-card);
    border: 1px solid rgba(0,217,255,0.2);
    border-radius: 30px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    width: 250px;
    outline: none;
    transition: all 0.3s;
  }

  .search-box:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(0,217,255,0.15);
  }

  .search-box::placeholder { color: var(--text-dim); }

  .filter-select {
    padding: 12px 20px;
    background: var(--bg-card);
    border: 1px solid rgba(0,217,255,0.2);
    border-radius: 30px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
  }

  .filter-select option { background: var(--bg-card); color: var(--text); }

  .periodic-wrapper {
    overflow-x: auto;
    padding: 20px 10px;
    background: var(--bg-card);
    border-radius: 20px;
    border: 1px solid rgba(0,217,255,0.1);
  }

  .periodic-table {
    display: grid;
    grid-template-columns: repeat(18, 58px);
    grid-template-rows: repeat(7, 58px);
    gap: 4px;
    justify-content: center;
    min-width: 1080px;
    margin: 0 auto;
  }

  .element {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid rgba(255,255,255,0.1);
    position: relative;
    padding: 3px;
    line-height: 1;
    user-select: none;
  }

  .element:hover {
    transform: scale(1.15);
    z-index: 10;
    box-shadow: 0 0 20px currentColor;
    border-color: white;
  }

  .element.hidden {
    opacity: 0.1;
    pointer-events: none;
  }

  .element .num { font-size: 9px; opacity: 0.85; }
  .element .sym { font-size: 17px; font-weight: 800; margin: 1px 0; }
  .element .name { font-size: 8px; opacity: 0.9; }

  /* دسته‌ها */
  .alkali     { background: linear-gradient(135deg,#ff6b6b,#c92a2a); color:#fff; }
  .alkaline   { background: linear-gradient(135deg,#ffa94d,#e8590c); color:#fff; }
  .transition { background: linear-gradient(135deg,#ffd43b,#f08c00); color:#000; }
  .post-trans { background: linear-gradient(135deg,#69db7c,#2f9e44); color:#000; }
  .metalloid  { background: linear-gradient(135deg,#38d9a9,#087f5b); color:#000; }
  .nonmetal   { background: linear-gradient(135deg,#4dabf7,#1864ab); color:#fff; }
  .halogen    { background: linear-gradient(135deg,#b197fc,#5f3dc4); color:#fff; }
  .noble      { background: linear-gradient(135deg,#f783ac,#a61e4d); color:#fff; }
  .lanthanide { background: linear-gradient(135deg,#f06595,#862e9c); color:#fff; }
  .actinide   { background: linear-gradient(135deg,#c2255c,#5f0e28); color:#fff; }
  .unknown    { background: linear-gradient(135deg,#868e96,#495057); color:#fff; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    margin-top: 25px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 15px;
    transition: background 0.2s;
  }
  .legend-item:hover { background: rgba(0,217,255,0.1); }
  .legend-color {
    width: 16px; height: 16px; border-radius: 4px;
  }

  /* ====== آزمایشگاه ====== */
  .lab-container {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 30px;
    align-items: start;
  }

  @media (max-width: 768px) {
    .lab-container { grid-template-columns: 1fr; }
    .header h1 { font-size: 1.8em; }
  }

  .beaker-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: sticky;
    top: 20px;
  }

  .beaker {
    position: relative;
    width: 220px;
    height: 280px;
    margin: 20px auto;
  }

  .beaker-glass {
    position: absolute;
    bottom: 0;
    width: 220px;
    height: 260px;
    border: 5px solid rgba(168,218,220,0.6);
    border-top: none;
    border-radius: 0 0 25px 25px;
    background: rgba(255,255,255,0.03);
    box-shadow:
      inset 0 0 30px rgba(0,217,255,0.15),
      0 10px 40px rgba(0,0,0,0.5);
    overflow: hidden;
    backdrop-filter: blur(2px);
  }

  .beaker-glass::before {
    content: '';
    position: absolute;
    top: 20px;
    left: 15px;
    width: 15px;
    height: 100px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
    border-radius: 10px;
    z-index: 5;
    pointer-events: none;
  }

  .water {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 65%;
    background: linear-gradient(180deg, #4fc3f7 0%, #0288d1 100%);
    transition: background 1s ease, height 0.6s ease;
    border-radius: 0 0 20px 20px;
  }

  .water::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 0;
    width: 100%;
    height: 20px;
    background: inherit;
    border-radius: 50%;
    opacity: 0.8;
  }

  .bubbles {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
  }

  .bubble {
    position: absolute;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    animation: rise 2s infinite;
    box-shadow: inset 0 0 5px rgba(255,255,255,0.5);
  }

  @keyframes rise {
    0% { transform: translateY(0) scale(1); opacity: 0.9; }
    100% { transform: translateY(-200px) scale(0.5); opacity: 0; }
  }

  .result-text {
    margin-top: 20px;
    font-size: 15px;
    min-height: 50px;
    color: var(--primary);
    font-weight: 600;
    text-align: center;
    padding: 12px 20px;
    background: var(--bg-card);
    border-radius: 15px;
    border: 1px solid rgba(0,217,255,0.15);
    transition: all 0.3s;
    width: 100%;
    max-width: 300px;
  }

  .compound-list {
    background: var(--bg-card);
    border-radius: 20px;
    padding: 25px;
    border: 1px solid rgba(0,217,255,0.1);
  }

  .compound-list h3 {
    color: var(--primary);
    margin-bottom: 20px;
    font-size: 1.2em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .compounds {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .compound-btn {
    padding: 18px 12px;
    border-radius: 15px;
    border: 2px solid rgba(255,255,255,0.15);
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    transition: all 0.3s;
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }

  .compound-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
  }

  .compound-btn:hover::before { left: 100%; }

  .compound-btn:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    border-color: white;
  }

  .compound-btn small {
    display: block;
    opacity: 0.9;
    font-size: 11px;
    margin-top: 4px;
    font-weight: 400;
  }

  .reset-btn {
    padding: 12px 30px;
    background: linear-gradient(135deg, var(--danger), #c92a2a);
    color: #fff;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    transition: all 0.3s;
    display: block;
    margin: 0 auto;
  }

  .reset-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 20px rgba(255,71,87,0.4);
  }

  /* ====== ماشین‌حساب ====== */
  .calculator {
    max-width: 600px;
    margin: 0 auto;
    background: var(--bg-card);
    border-radius: 20px;
    padding: 30px;
    border: 1px solid rgba(0,217,255,0.1);
  }

  .calculator h2 {
    color: var(--primary);
    margin-bottom: 20px;
    text-align: center;
  }

  .calc-input {
    width: 100%;
    padding: 15px 20px;
    background: var(--bg-dark);
    border: 2px solid rgba(0,217,255,0.2);
    border-radius: 12px;
    color: var(--text);
    font-size: 18px;
    font-family: inherit;
    outline: none;
    margin-bottom: 15px;
    transition: all 0.3s;
    direction: ltr;
    text-align: center;
  }

  .calc-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(0,217,255,0.15);
  }

  .calc-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--primary), #9d4edd);
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    transition: all 0.3s;
  }

  .calc-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,217,255,0.4);
  }

  .calc-result {
    margin-top: 20px;
    padding: 20px;
    background: var(--bg-dark);
    border-radius: 12px;
    border: 1px solid rgba(0,217,255,0.2);
    text-align: center;
    font-size: 16px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
  }

  .calc-result .value {
    font-size: 28px;
    font-weight: 800;
    color: var(--success);
  }

  .hint {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    margin-top: 10px;
  }

  /* ====== مودال ====== */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
    backdrop-filter: blur(5px);
  }
  .modal.show { display: flex; }

  .modal-content {
    background: linear-gradient(135deg, var(--bg-card), var(--bg-card-2));
    padding: 35px;
    border-radius: 25px;
    border: 2px solid var(--primary);
    max-width: 450px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,217,255,0.3);
    animation: modalIn 0.3s ease;
  }

  @keyframes modalIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-content h2 {
    color: var(--primary);
    margin-bottom: 20px;
    font-size: 32px;
    text-shadow: 0 0 20px rgba(0,217,255,0.5);
  }

  .modal-content p {
    margin: 10px 0;
    font-size: 15px;
    text-align: right;
    padding: 8px 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
  }

  .modal-content p strong { color: var(--primary); }

  .close-btn {
    margin-top: 20px;
    padding: 12px 30px;
    background: linear-gradient(135deg, var(--primary), #9d4edd);
    color: #000;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 800;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.3s;
  }

  .close-btn:hover { transform: scale(1.05); }

  /* اسکرول‌بار */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-dark); }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(135deg, var(--primary), #9d4edd);
    border-radius: 10px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🧪 آزمایشگاه شیمی حرفه‌ای</h1>
  <p>جدول تناوبی، آزمایشگاه مجازی، و ماشین‌حساب جرم مولی</p>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="periodic" type="button">📊 جدول تناوبی</button>
  <button class="tab-btn" data-tab="lab" type="button">💧 آزمایشگاه</button>
  <button class="tab-btn" data-tab="calc" type="button">🧮 ماشین‌حساب</button>
</div>

<!-- ====== بخش جدول تناوبی ====== -->
<div id="periodic" class="section active">
  <div class="controls">
    <input type="text" class="search-box" id="searchInput" placeholder="🔍 جستجو: نام، نماد یا عدد اتمی...">
    <select class="filter-select" id="filterSelect">
      <option value="all">همه دسته‌ها</option>
      <option value="alkali">فلز قلیایی</option>
      <option value="alkaline">فلز قلیایی خاکی</option>
      <option value="transition">فلز واسطه</option>
      <option value="post-trans">فلز پس‌واسطه</option>
      <option value="metalloid">شبه‌فلز</option>
      <option value="nonmetal">نافلز</option>
      <option value="halogen">هالوژن</option>
      <option value="noble">گاز نجیب</option>
      <option value="lanthanide">لانتانید</option>
      <option value="actinide">اکتینید</option>
    </select>
  </div>

  <div class="periodic-wrapper">
    <div class="periodic-table" id="periodicTable"></div>
  </div>

  <div class="legend" id="legend"></div>
</div>

<!-- ====== بخش آزمایشگاه ====== -->
<div id="lab" class="section">
  <div class="lab-container">
    <div class="beaker-side">
      <div class="beaker">
        <div class="beaker-glass">
          <div class="water" id="water"></div>
          <div class="bubbles" id="bubbles"></div>
        </div>
      </div>
      <div class="result-text" id="resultText">یک ترکیب را انتخاب کنید…</div>
    </div>

    <div class="compound-list">
      <h3>🧴 ترکیب‌های شیمیایی</h3>
      <div class="compounds" id="compounds"></div>
      <button class="reset-btn" id="resetBtn" type="button">🔄 ریست کردن آب</button>
    </div>
  </div>
</div>

<!-- ====== بخش ماشین‌حساب ====== -->
<div id="calc" class="section">
  <div class="calculator">
    <h2>🧮 محاسبه‌گر جرم مولی</h2>
    <input type="text" class="calc-input" id="calcInput" placeholder="مثال: H2O یا NaCl یا C6H12O6" dir="ltr">
    <button class="calc-btn" id="calcBtn" type="button">محاسبه جرم مولی</button>
    <div class="calc-result" id="calcResult">
      نتیجه اینجا نمایش داده می‌شود
    </div>
    <p class="hint">💡 فرمول شیمیایی رو با حروف بزرگ/کوچیک درست وارد کن. مثال: H2SO4</p>
  </div>
</div>

<!-- ====== مودال اطلاعات عنصر ====== -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle"></h2>
    <div id="modalInfo"></div>
    <button class="close-btn" id="closeModalBtn" type="button">بستن</button>
  </div>
</div>

<script>
